name: Compile revised paper

on:
  push:
    branches:
      - paper-revisions-sep13
    paths-ignore:
      - 'figs/*.eps'
      - 'main.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Convert original JPG figures to EPS
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          figdir = Path('figs')
          for src in sorted(figdir.glob('*.jpg')):
              dst = src.with_suffix('.eps')
              with Image.open(src) as im:
                  if im.mode not in ('RGB', 'L'):
                      im = im.convert('RGB')
                  im.save(dst, format='EPS')
              print(f'{src} -> {dst}')
          PY

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -shell-escape

      - name: Commit EPS figures and compiled PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add figs/*.eps main.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Compile revised paper with EPS figures'
            git push
          fi
